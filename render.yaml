# Render Blueprint — https://render.com/docs/blueprint-spec
# Only the football-backend (serves /football-stories for the KOORAZONE FOOT
# mobile app) deploys from this repo via Blueprint. The mobile app itself, at
# the repo root (Expo/React Native), is not a Render service — it's built and
# published through EAS (see eas.json), not this file.
#
# NOTE: koora-ai.onrender.com already exists and was not created from this
# file, so Render won't auto-adopt it — see backend/README.md "Deploy to
# Render" for how to point it at backend/ (or create a fresh service here).
# No env vars needed — this service has zero external dependencies.
services:
  - type: web
    name: koora-ai-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
